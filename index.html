<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101426" />
    <meta name="description" content="支持电脑和手机操作的网页版俄罗斯方块小游戏" />
    <title>霓虹方块 · 俄罗斯方块</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">PIXEL BREAK</p>
          <h1>霓虹方块</h1>
        </div>
        <button id="soundButton" class="icon-button" type="button" aria-label="切换音效" aria-pressed="true">
          <span aria-hidden="true">♪</span>
        </button>
      </header>

      <section class="game-layout" aria-label="俄罗斯方块游戏区">
        <aside class="side-panel stats-panel" aria-label="游戏数据">
          <div class="panel-label">数据</div>
          <article class="stat-card featured">
            <span>分数</span>
            <strong id="score">000000</strong>
          </article>
          <div class="stat-grid">
            <article class="stat-card">
              <span>消除</span>
              <strong id="lines">0</strong>
            </article>
            <article class="stat-card">
              <span>等级</span>
              <strong id="level">1</strong>
            </article>
          </div>
          <article class="stat-card best-card">
            <span>最高分</span>
            <strong id="highScore">000000</strong>
          </article>
        </aside>

        <div class="board-column">
          <div id="boardWrap" class="board-wrap">
            <canvas id="gameCanvas" width="300" height="600" aria-label="俄罗斯方块棋盘"></canvas>
            <div id="overlay" class="game-overlay">
              <p id="overlayKicker" class="overlay-kicker">准备好了吗？</p>
              <h2 id="overlayTitle">开始游戏</h2>
              <p id="overlayText">排列方块，填满一整行即可消除</p>
              <button id="startButton" class="primary-button" type="button">开始挑战</button>
            </div>
          </div>

          <div class="status-row" aria-live="polite">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">等待开始</span>
            <button id="pauseButton" class="text-button" type="button">暂停</button>
          </div>
        </div>

        <aside class="side-panel next-panel" aria-label="下一个方块与电脑操作说明">
          <div class="panel-label">下一个</div>
          <div class="preview-card">
            <canvas id="nextCanvas" width="120" height="120" aria-label="下一个方块"></canvas>
          </div>
          <div class="keyboard-help">
            <div><kbd>←</kbd><kbd>→</kbd><span>移动</span></div>
            <div><kbd>↑</kbd><span>旋转</span></div>
            <div><kbd>↓</kbd><span>加速</span></div>
            <div><kbd>空格</kbd><span>直落</span></div>
          </div>
        </aside>
      </section>

      <section class="mobile-controls" aria-label="手机触控按钮">
        <button type="button" data-action="left" aria-label="向左移动">←</button>
        <button type="button" data-action="rotate" aria-label="旋转方块">↻</button>
        <button type="button" data-action="right" aria-label="向右移动">→</button>
        <button class="wide" type="button" data-action="down" aria-label="向下加速">↓ 加速</button>
        <button class="wide accent" type="button" data-action="drop" aria-label="方块直落">直落</button>
      </section>

      <footer>
        <span>填满一行 · 保持节奏 · 突破纪录</span>
        <button id="restartButton" class="text-button" type="button">重新开始</button>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
